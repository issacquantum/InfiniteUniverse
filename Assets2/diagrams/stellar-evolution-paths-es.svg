<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1190" role="img" aria-labelledby="title desc"><title id="title">Rutas de evolución estelar</title><desc id="desc">Rutas distintas para estrellas de masa muy baja, solar o intermedia y alta, con cambios por interacción binaria.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#c998f0"/></marker></defs><rect width="360" height="1190" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="30" font-size="21" text-anchor="middle" fill="#eadbff">Rutas de evolución estelar</text><text x="180" y="57" font-size="16" text-anchor="middle" fill="#eadbff">Rutas posibles, no destinos únicos</text><text x="180" y="81" font-size="16" text-anchor="middle" fill="#eadbff">H = hidrógeno; He = helio</text><rect x="20" y="102" width="320" height="208" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="129" font-size="18" text-anchor="middle" fill="#eadbff">Las menores masas estelares</text><text x="180" y="159" font-size="18" text-anchor="middle" fill="#eadbff">Enana roja: fusión central de H</text><path d="M180,171 L180,195" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="221" font-size="17" text-anchor="middle" fill="#eadbff">Agotamiento del combustible</text><text x="180" y="245" font-size="17" text-anchor="middle" fill="#eadbff">Enana blanca rica en He</text><text x="180" y="269" font-size="17" text-anchor="middle" fill="#eadbff">Final predicho; aún no observado</text><rect x="20" y="330" width="320" height="237" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="357" font-size="18" text-anchor="middle" fill="#eadbff">Masas solares e intermedias</text><text x="180" y="386" font-size="17" text-anchor="middle" fill="#eadbff">Secuencia principal: fusión de H</text><path d="M180,397 L180,415" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="440" font-size="18" text-anchor="middle" fill="#eadbff">Gigantes y pérdida de envoltura</text><path d="M180,451 L180,473" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="500" font-size="15" text-anchor="middle" fill="#eadbff">Enana blanca que se enfría</text><text x="180" y="524" font-size="15" text-anchor="middle" fill="#eadbff">La nebulosa no siempre es visible</text><text x="180" y="548" font-size="15" text-anchor="middle" fill="#eadbff">Hay otras rutas cerca del límite superior</text><rect x="20" y="587" width="320" height="330" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="614" font-size="19" text-anchor="middle" fill="#eadbff">Estrellas masivas</text><text x="180" y="643" font-size="17" text-anchor="middle" fill="#eadbff">Secuencia principal: fusión de H</text><path d="M180,654 L180,675" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="700" font-size="17" text-anchor="middle" fill="#eadbff">Supergigante o estrella despojada</text><text x="180" y="724" font-size="17" text-anchor="middle" fill="#eadbff">Fusión avanzada; pérdida de masa</text><path d="M180,738 L91,770" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,738 L267,770" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="96" y="797" font-size="17" text-anchor="middle" fill="#eadbff">Colapso</text><text x="96" y="821" font-size="17" text-anchor="middle" fill="#eadbff">Estrella de</text><text x="96" y="845" font-size="17" text-anchor="middle" fill="#eadbff">neutrones o</text><text x="96" y="869" font-size="17" text-anchor="middle" fill="#eadbff">agujero negro</text><text x="265" y="797" font-size="16" text-anchor="middle" fill="#eadbff">Ciertos núcleos</text><text x="265" y="821" font-size="16" text-anchor="middle" fill="#eadbff">muy masivos:</text><text x="265" y="845" font-size="16" text-anchor="middle" fill="#eadbff">disrupción total,</text><text x="265" y="869" font-size="16" text-anchor="middle" fill="#eadbff">sin remanente</text><rect x="20" y="937" width="320" height="150" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="965" font-size="17" text-anchor="middle" fill="#eadbff">Las binarias abren otras rutas</text><text x="180" y="989" font-size="17" text-anchor="middle" fill="#eadbff">Transferencia de masa o fusión estelar</text><text x="180" y="1013" font-size="17" text-anchor="middle" fill="#eadbff">pueden cambiar el destino.</text><text x="180" y="1037" font-size="17" text-anchor="middle" fill="#eadbff">Una enana blanca puede producir</text><text x="180" y="1061" font-size="17" text-anchor="middle" fill="#eadbff">una supernova termonuclear de tipo Ia.</text><text x="180" y="1118" font-size="17" text-anchor="middle" fill="#eadbff">Composición, rotación y vientos</text><text x="180" y="1142" font-size="17" text-anchor="middle" fill="#eadbff">modifican todas estas rutas.</text><text x="180" y="1166" font-size="17" text-anchor="middle" fill="#eadbff">Sin límites universales de masa.</text></g></svg>
