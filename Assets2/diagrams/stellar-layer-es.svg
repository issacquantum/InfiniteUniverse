<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc"><title id="title">Fuerzas sobre una capa estelar</title><desc id="desc">La presión interior empuja hacia fuera; la exterior y la gravedad, hacia dentro.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#d3b0ff"/></marker></defs><rect width="360" height="470" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="28" font-size="20" text-anchor="middle" fill="#eadbff">Capa estelar delgada</text><text x="180" y="55" font-size="15" text-anchor="middle" fill="#eadbff">Columna radial; no está a escala</text><circle cx="46" cy="198" r="20" fill="#5c288c" stroke="#be8df1"/><text x="46" y="238" font-size="16" text-anchor="middle" fill="#eadbff">Centro</text><path d="M46,285 L190,285" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><text x="120" y="310" font-size="19" text-anchor="middle" fill="#eadbff">r</text><rect x="190" y="143" width="65" height="110" fill="#6b3690" fill-opacity=".5" stroke="#eadbff"/><text x="222" y="130" font-size="18" text-anchor="middle" fill="#eadbff">A</text><path d="M190,330 L255,330" fill="none" stroke="#b780f0" stroke-width="2"/><text x="223" y="355" font-size="18" text-anchor="middle" fill="#eadbff">dr</text><path d="M190,175 L285,175" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><text x="100" y="108" font-size="18" text-anchor="start" fill="#eadbff">P(r) A</text><path d="M255,220 L210,220" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><text x="254" y="270" font-size="16" text-anchor="middle" fill="#eadbff">P(r + dr) A</text><path d="M221,200 L140,200" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><text x="98" y="390" font-size="17" text-anchor="start" fill="#eadbff">Gravedad hacia el centro</text><text x="20" y="425" font-size="17" text-anchor="start" fill="#eadbff">M(r): masa dentro de r</text><text x="20" y="450" font-size="16" text-anchor="start" fill="#eadbff">A: área de la cara; dr: espesor</text></g></svg>
