<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 483" role="img" aria-labelledby="title desc"><title id="title">Proportional Mesozoic timeline</title><desc id="desc">Triassic 50.502 million years, Jurassic 58.3, Cretaceous 77.1. Equal vertical distances represent equal durations.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#d3b0ff"/></marker></defs><rect width="360" height="483" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="27" font-size="20" text-anchor="middle" fill="#eadbff">Mesozoic time scale</text><rect x="30" y="55.000" width="40" height="101.004" fill="#694391" stroke="#eedbff"/><text x="88" y="60.0" font-size="16" text-anchor="start" fill="#eadbff">251.902</text><text x="88" y="105.50199999999998" font-size="19" text-anchor="start" fill="#eadbff">Triassic</text><text x="88" y="129.50199999999998" font-size="15" text-anchor="start" fill="#eadbff">50.502 million years</text><rect x="30" y="156.004" width="40" height="116.600" fill="#9860c3" stroke="#eedbff"/><text x="88" y="161.00399999999996" font-size="16" text-anchor="start" fill="#eadbff">201.4</text><text x="88" y="214.30399999999997" font-size="19" text-anchor="start" fill="#eadbff">Jurassic</text><text x="88" y="238.30399999999997" font-size="15" text-anchor="start" fill="#eadbff">58.3 million years</text><rect x="30" y="272.604" width="40" height="154.200" fill="#ba86df" stroke="#eedbff"/><text x="88" y="277.604" font-size="16" text-anchor="start" fill="#eadbff">143.1</text><text x="88" y="349.70399999999995" font-size="19" text-anchor="start" fill="#eadbff">Cretaceous</text><text x="88" y="373.70399999999995" font-size="15" text-anchor="start" fill="#eadbff">77.1 million years</text><text x="88" y="431.804" font-size="16" text-anchor="start" fill="#eadbff">66.0</text><text x="180" y="461" font-size="15" text-anchor="middle" fill="#eadbff">Older ↑    Age in Ma    ↓ Younger</text></g></svg>
