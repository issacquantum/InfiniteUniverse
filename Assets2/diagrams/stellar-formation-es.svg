<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 783" role="img" aria-labelledby="title desc"><title id="title">De la nube a la estrella</title><desc id="desc">La contracción conduce a una protoestrella con disco y posibles flujos expulsados, y luego a fusión central sostenida.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#c998f0"/></marker></defs><rect width="360" height="783" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="30" font-size="21" text-anchor="middle" fill="#eadbff">De la nube a la estrella</text><text x="180" y="56" font-size="16" text-anchor="middle" fill="#eadbff">Esquema, no una escala de tiempo</text><rect x="20" y="76" width="320" height="162" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="102" font-size="19" text-anchor="middle" fill="#eadbff">Región densa en colapso</text><ellipse cx="180" cy="170" rx="67" ry="43" fill="#432052" stroke="#a16bbb" stroke-dasharray="5 4"/><circle cx="180" cy="170" r="18" fill="#b180cf"/><path d="M93,170 L150,170" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M267,170 L210,170" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,118 L180,142" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,221 L180,198" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,239 L180,266" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="276" width="320" height="239" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="305" font-size="19" text-anchor="middle" fill="#eadbff">Protoestrella y disco</text><ellipse cx="180" cy="404" rx="88" ry="23" fill="#402457" stroke="#c998f0" stroke-width="2"/><circle cx="180" cy="404" r="20" fill="#e6c4fb"/><path d="M180,379 L180,337" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,429 L180,471" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M96,403 L149,403" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M264,403 L211,403" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="271" y="350" font-size="16" text-anchor="middle" fill="#eadbff">Flujo</text><text x="271" y="374" font-size="16" text-anchor="middle" fill="#eadbff">expulsado</text><text x="74" y="445" font-size="17" text-anchor="middle" fill="#eadbff">Disco</text><text x="180" y="495" font-size="18" text-anchor="middle" fill="#eadbff">Acreción + contracción</text><path d="M180,516 L180,546" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="556" width="320" height="151" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="585" font-size="19" text-anchor="middle" fill="#eadbff">Secuencia principal</text><circle cx="74" cy="646" r="27" fill="#d5a5ef" stroke="#f0dfff"/><text x="228" y="628" font-size="18" text-anchor="middle" fill="#eadbff">Fusión sostenida</text><text x="228" y="652" font-size="18" text-anchor="middle" fill="#eadbff">de hidrógeno</text><text x="228" y="676" font-size="18" text-anchor="middle" fill="#eadbff">en el núcleo</text><text x="180" y="737" font-size="16" text-anchor="middle" fill="#eadbff">Las etapas pueden superponerse.</text><text x="180" y="761" font-size="16" text-anchor="middle" fill="#eadbff">La masa y el entorno cambian la ruta.</text></g></svg>
