<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1190" role="img" aria-labelledby="title desc"><title id="title">Stellar evolution paths</title><desc id="desc">Different paths for the lowest-mass, Sun-like or intermediate, and massive stars, with changes from binary interaction.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#c998f0"/></marker></defs><rect width="360" height="1190" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="30" font-size="21" text-anchor="middle" fill="#eadbff">Stellar evolution paths</text><text x="180" y="57" font-size="16" text-anchor="middle" fill="#eadbff">Possible paths, not unique outcomes</text><text x="180" y="81" font-size="16" text-anchor="middle" fill="#eadbff">H = hydrogen; He = helium</text><rect x="20" y="102" width="320" height="208" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="129" font-size="18" text-anchor="middle" fill="#eadbff">Lowest stellar masses</text><text x="180" y="159" font-size="18" text-anchor="middle" fill="#eadbff">Red dwarf: core H burning</text><path d="M180,171 L180,195" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="221" font-size="17" text-anchor="middle" fill="#eadbff">Fuel exhausted</text><text x="180" y="245" font-size="17" text-anchor="middle" fill="#eadbff">He-rich white dwarf</text><text x="180" y="269" font-size="17" text-anchor="middle" fill="#eadbff">Predicted ending; not yet observed</text><rect x="20" y="330" width="320" height="237" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="357" font-size="18" text-anchor="middle" fill="#eadbff">Sun-like and intermediate masses</text><text x="180" y="386" font-size="17" text-anchor="middle" fill="#eadbff">Main sequence: H burning</text><path d="M180,397 L180,415" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="440" font-size="18" text-anchor="middle" fill="#eadbff">Giants and envelope loss</text><path d="M180,451 L180,473" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="500" font-size="15" text-anchor="middle" fill="#eadbff">Cooling white dwarf</text><text x="180" y="524" font-size="15" text-anchor="middle" fill="#eadbff">Nebula not always visible</text><text x="180" y="548" font-size="15" text-anchor="middle" fill="#eadbff">Other paths near the upper mass end</text><rect x="20" y="587" width="320" height="330" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="614" font-size="19" text-anchor="middle" fill="#eadbff">Massive stars</text><text x="180" y="643" font-size="17" text-anchor="middle" fill="#eadbff">Main sequence: H burning</text><path d="M180,654 L180,675" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="700" font-size="17" text-anchor="middle" fill="#eadbff">Supergiant or stripped star</text><text x="180" y="724" font-size="17" text-anchor="middle" fill="#eadbff">Advanced burning; mass loss</text><path d="M180,738 L91,770" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,738 L267,770" fill="none" stroke="#c998f0" stroke-width="2" marker-end="url(#arrow)"/><text x="96" y="797" font-size="17" text-anchor="middle" fill="#eadbff">Collapse</text><text x="96" y="821" font-size="17" text-anchor="middle" fill="#eadbff">Neutron star</text><text x="96" y="845" font-size="17" text-anchor="middle" fill="#eadbff">or black hole</text><text x="265" y="797" font-size="16" text-anchor="middle" fill="#eadbff">Some very</text><text x="265" y="821" font-size="16" text-anchor="middle" fill="#eadbff">massive cores:</text><text x="265" y="845" font-size="16" text-anchor="middle" fill="#eadbff">full disruption,</text><text x="265" y="869" font-size="16" text-anchor="middle" fill="#eadbff">no remnant</text><rect x="20" y="937" width="320" height="150" rx="12" fill="#1b0d2b" stroke="#8554aa"/><text x="180" y="965" font-size="17" text-anchor="middle" fill="#eadbff">Binaries open other paths</text><text x="180" y="989" font-size="17" text-anchor="middle" fill="#eadbff">Mass transfer or stellar merger</text><text x="180" y="1013" font-size="17" text-anchor="middle" fill="#eadbff">can change the outcome.</text><text x="180" y="1037" font-size="17" text-anchor="middle" fill="#eadbff">A white dwarf can produce</text><text x="180" y="1061" font-size="17" text-anchor="middle" fill="#eadbff">a Type Ia thermonuclear supernova.</text><text x="180" y="1118" font-size="17" text-anchor="middle" fill="#eadbff">Composition, rotation and winds</text><text x="180" y="1142" font-size="17" text-anchor="middle" fill="#eadbff">modify these paths.</text><text x="180" y="1166" font-size="17" text-anchor="middle" fill="#eadbff">No universal mass cutoffs.</text></g></svg>
