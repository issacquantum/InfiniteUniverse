<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 455" role="img" aria-labelledby="title desc"><title id="title">Hertzsprung-Russell diagram</title><desc id="desc">Luminosity increases upward. Temperature decreases to the right. Main sequence runs from hot luminous to cool faint; red giants are cool and luminous, white dwarfs hot and faint.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#d3b0ff"/></marker></defs><rect width="360" height="455" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="27" font-size="21" text-anchor="middle" fill="#eadbff">Hertzsprung-Russell</text><text x="180" y="52" font-size="16" text-anchor="middle" fill="#eadbff">Schematic regions, not measured stars</text><path d="M70,350 L330,350" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="355" font-size="15" text-anchor="end" fill="#eadbff">10⁻⁴</text><path d="M70,296 L330,296" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="301" font-size="15" text-anchor="end" fill="#eadbff">10⁻²</text><path d="M70,242 L330,242" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="247" font-size="15" text-anchor="end" fill="#eadbff">10⁰</text><path d="M70,188 L330,188" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="193" font-size="15" text-anchor="end" fill="#eadbff">10²</text><path d="M70,134 L330,134" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="139" font-size="15" text-anchor="end" fill="#eadbff">10⁴</text><path d="M70,80 L330,80" fill="none" stroke="#3d2555" stroke-width="2"/><text x="60" y="85" font-size="15" text-anchor="end" fill="#eadbff">10⁶</text><path d="M70,350 L70,65" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><path d="M70,350 L335,350" fill="none" stroke="#b780f0" stroke-width="2" marker-end="url(#arrow)"/><text x="19" y="225" transform="rotate(-90 19 225)" font-size="17" text-anchor="middle" fill="#eadbff">L / L☉</text><text x="70.0" y="378" font-size="16" text-anchor="middle" fill="#eadbff">30 000</text><text x="194.05152622711228" y="378" font-size="16" text-anchor="middle" fill="#eadbff">10 000</text><text x="330.0" y="378" font-size="16" text-anchor="middle" fill="#eadbff">3 000</text><text x="200" y="404" font-size="17" text-anchor="middle" fill="#eadbff">Effective temperature (K)</text><text x="180" y="434" font-size="17" text-anchor="middle" fill="#eadbff">Hot ←                 → Cool</text><polyline points="70.00,120.50 115.78,150.20 194.05,201.50 255.56,242.00 297.52,282.50 330.00,323.00" fill="none" stroke="#9f6cc9" stroke-width="14" stroke-linecap="round"/><polyline points="242.69,188.00 274.60,174.50 303.31,150.20" fill="none" stroke="#d69bed" stroke-width="20" stroke-linecap="round"/><polyline points="90.59,269.00 148.27,296.00 219.25,323.00 251.73,350.00" fill="none" stroke="#87c8df" stroke-width="12" stroke-linecap="round"/><text x="112" y="130" font-size="16" text-anchor="start" fill="#eadbff">Main sequence</text><text x="235" y="105" font-size="16" text-anchor="middle" fill="#eadbff">Red giants</text><text x="150" y="323" font-size="16" text-anchor="middle" fill="#eadbff">White dwarfs</text><circle cx="256.11" cy="242" r="5" fill="#fff"/><text x="266.1066823975336" y="260" font-size="15" text-anchor="start" fill="#eadbff">Sun</text></g></svg>
