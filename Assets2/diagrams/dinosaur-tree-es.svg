<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" role="img" aria-labelledby="title desc"><title id="title">Aves dentro de los dinosaurios terópodos</title><desc id="desc">Árbol tradicional simplificado. Las aves están dentro de Maniraptora, Theropoda, Saurischia y Dinosauria. Velociraptor es un pariente, no un ancestro directo de las aves.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#d3b0ff"/></marker></defs><rect width="360" height="485" rx="12" fill="#10071d"/><g font-family="Georgia,serif"><text x="180" y="28" font-size="18" text-anchor="middle" fill="#eadbff">Ramas seleccionadas de dinosaurios</text><text x="25" y="65" font-size="17" text-anchor="start" fill="#eadbff">Dinosauria</text><text x="55" y="112" font-size="17" text-anchor="start" fill="#eadbff">Ornithischia</text><text x="55" y="161" font-size="17" text-anchor="start" fill="#eadbff">Saurischia</text><text x="85" y="210" font-size="17" text-anchor="start" fill="#eadbff">Sauropodomorpha</text><text x="85" y="259" font-size="17" text-anchor="start" fill="#eadbff">Theropoda</text><text x="115" y="308" font-size="17" text-anchor="start" fill="#eadbff">Allosaurus</text><text x="115" y="357" font-size="17" text-anchor="start" fill="#eadbff">Maniraptora</text><text x="145" y="406" font-size="17" text-anchor="start" fill="#eadbff">Velociraptor</text><text x="145" y="455" font-size="17" text-anchor="start" fill="#eadbff">Aves (dinosaurios vivos)</text><path d="M33,72 V106 H50" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M33,72 V155 H50" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M63,168 V204 H80" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M63,168 V253 H80" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M93,266 V302 H110" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M93,266 V351 H110" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M123,364 V400 H140" fill="none" stroke="#bd8af2" stroke-width="2"/><path d="M123,364 V449 H140" fill="none" stroke="#bd8af2" stroke-width="2"/></g></svg>
